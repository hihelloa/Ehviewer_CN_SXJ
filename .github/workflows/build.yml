name: Build

on:
  push:
    branches: [ BiLi_PC_Gamer, main ]
  pull_request:
    branches: [ BiLi_PC_Gamer, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/appRelease/debug/*.apk EhViewer_v1.3.3_retry.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./app/build/outputs/apk/

      # 直接在 runner 内发 Release：artifact 下载要绕 Azure，
      # 往返 40MB + 73MB，慢链路上经常中断，放这里只要几秒。
      - name: Publish Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.3-retry
          name: EhViewer v1.3.3（失败页无限重试 + 下载/看图加速）
          body: |
            ## 本次改动

            - **下载失败的图片不再作废，而是自动一直重试**：以前某一页失败后就被标记成
              "失败"，整本下载任务直接结束，那几页永远补不回来。现在失败页会进入重试队列，
              按 2s、4s、8s… 退避到 30s 封顶反复重下，直到成功或用户主动停止任务。
            - 重试在后台由空闲 worker 完成，不会占用正常页的下载位置，也不会让页面卡死。
            - **翻译取图同样不再放弃**：整本翻译里某页取不到图时，以前重试 90 次（约 40 分钟）
              就跳过；现在会一直重试，直到拿到图或用户取消。
            - 重试期间进度会停在当前百分比，这是正常的，说明它在等失败页补回来。

            ## 已经修好的问题（上一版）

            - 烧录译文缺失时回退气泡，系统清缓存后不会出现"翻译记录还在、画面没译文"
            - 烧录图从 cacheDir 迁到 filesDir，旧图自动迁移
            - 解除 OkHttp 单 host 5 并发上限（下载线程 6 / 预加载 8 才真正生效）
            - 图片请求不再挂 HTTP 磁盘缓存，去掉每张图多写一遍的写放大
            - DNS 加内存缓存，下载进度回调从每 4KB 一次改为 1%/256KB 节流
            - 预加载改成前 2 页 + 后 8 页，往回翻不再重新等下载
          files: EhViewer_v1.3.3_retry.apk
          draft: false
          prerelease: false
