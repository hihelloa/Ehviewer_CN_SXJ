name: Build

on:
  push:
    branches: [ BiLi_PC_Gamer, main ]
  pull_request:
    branches: [ BiLi_PC_Gamer, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/appRelease/debug/*.apk EhViewer_v1.3.4_full.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./app/build/outputs/apk/

      # 直接在 runner 内发 Release：artifact 下载要绕 Azure，
      # 往返 40MB + 73MB，慢链路上经常中断，放这里只要几秒。
      - name: Publish Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.4-full
          name: EhViewer v1.3.4（翻译完整性修复）
          body: |
            ## 本次修复：翻译不全

            ### 1. OCR 输入分辨率

            原来整页缩到长边 1800px 再识别。但 Bitmap 采样只能取 2 的幂，
            1600×2400 的页面会被**直接砍成 800×1200**，漫画小字全部糊掉。
            现在改为精确缩放，保持最长边 2600。

            ### 2. 长页切片识别

            长条页整张送进 ML Kit 会被内部降采样，底部文字基本识别不出来。
            现在按 1400px 高度切片、带 220px 重叠，逐片识别后合并去重。

            ### 3. 译文不再被裁掉

            原来绘制时用 `clipRect` 把超出原文框的部分硬裁，中文比日文长，
            经常只显示前两行。现在背景随文字实际高度扩展（最多 3 倍），
            竖排窄框优先向两侧扩宽，文字始终完整可见。

            ### 4. 漏译的块会补翻

            翻译失败的块以前会把日文写回"译文"，烧录时又把原文画一遍。
            现在失败保持空白，整页翻译后再补两轮；一句都没译出来时不生成烧录图。

            ### 5. 旧的残缺缓存会重建

            升级后第一次点「翻译整本」，检测到 v1 缓存会整本重译。
            v1 是 1800px 缩略图 OCR 的产物，本身就是漏字的，
            不重建的话这些页会被永久跳过。

            ## 使用提示

            装好后打开之前翻译过的书，点一次「翻译整本」触发重建。
            页数多的话会跑一段时间，进度条会正常推进。

            ## 之前版本已修复

            - 下载失败页无限退避重试，不再作废
            - 烧录图迁到 filesDir，烧录缺失时回退气泡
            - 解除 OkHttp 单 host 5 并发上限
            - 图片请求去掉重复的 HTTP 磁盘缓存写入
            - DNS 内存缓存、进度回调节流、预加载前 2 后 8
          files: EhViewer_v1.3.4_full.apk
          draft: false
          prerelease: false
