name: Build

on:
  push:
    branches: [ BiLi_PC_Gamer, main ]
  pull_request:
    branches: [ BiLi_PC_Gamer, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      # 固定签名证书，保证每个版本证书一致，可以直接覆盖升级。
      # 证书只存在于仓库 Secrets 里，不进代码库。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，无法签名"
            exit 1
          fi
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/ehviewer-release.jks

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleAppReleaseRelease -x lintVitalAppReleaseRelease --stacktrace

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/appRelease/release/*.apk | head -1)
          echo "构建产物：$APK"
          cp "$APK" EhViewer_v1.3.10_tls.apk

      - name: Verify signature
        run: |
          keytool -printcert -jarfile EhViewer_v1.3.10_tls.apk
          keytool -printcert -jarfile EhViewer_v1.3.10_tls.apk \
            | grep -q "F2:A9:F5:3A:7C:BD:F6:56:B4:F7:3E:90:6A:F4:F2:51:C2:5E:F5:31:01:1D:4E:76:49:EB:2E:9D:85:5E:AD:A0" \
            || (echo "::error::APK 签名不是预期的固定证书" && exit 1)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: ./app/build/outputs/apk/

      # 直接在 runner 内发 Release：artifact 下载要绕 Azure，
      # 往返 40MB + 73MB，慢链路上经常中断，放这里只要几秒。
      - name: Publish Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.10-tls
          name: EhViewer v1.3.10（TLS 握手兼容）
          body: |
            ## 这一版：解决「测试连接报 TLS 握手失败」

            ### 这个报错是什么意思

            截图里的 `HANDSHAKE_FAILURE_ON_CLIENT_HELLO` 不是 Key 填错，也不是模型名不对。
            它是手机到 API 服务器这一段 TLS 握手被拒绝了，请求还没发出去。

            服务器本身是好的：实测该地址 TLS 1.2 和 TLS 1.3 都能正常握手。
            问题出在中间链路上，常见三种：VPN / 代理对 TLS 做了拦截、
            运营商对 TLS 1.3 的 ClientHello 有干扰、中转站只接受 TLS 1.2。

            ### 新增「仅用 TLS 1.2 连接」

            设置 → 翻译 → 仅用 TLS 1.2 连接。

            打开后翻译请求固定走 TLS 1.2 + HTTP/1.1，绕开 TLS 1.3 ClientHello 被拒的情况。
            只影响翻译请求，看图、下载走的是另一条通道，不受影响。改完开关立即生效，不用重启。

            ### 错误提示改成能看懂的

            以前失败时直接把 BoringSSL 的堆栈甩出来。现在按类型给结论：

            - TLS 握手失败 → 提示先断开 VPN/代理，仍失败就打开上面的兼容开关
            - 连接超时 → 提示换网络或换个时段
            - 域名解析失败 → 提示检查地址拼写
            - HTTP 401 / 404 → 提示检查 Key 和模型名

            ---

            ## v1.3.9：译文强制中文

            ### 内置提示词已改成强制中文

            发给模型的系统提示词现在是：

            > 你是一名日文漫画的专职翻译。用户会按编号给你若干条日文台词，你要逐条译成简体中文。
            > 硬性要求：
            > 1. 输出语言只能是简体中文。原文里的日文假名必须译成中文，禁止保留假名、禁止输出日文原文、禁止罗马音、禁止英文。
            > 2. 每条译文单独一行，格式为「编号. 译文」，编号和顺序必须与输入完全一致。
            > 3. 不要合并、拆分、遗漏任何一条；输入里本来就是中文的条目照抄即可。
            > 4. 不要输出解释、注释、引号、markdown 代码块或任何额外内容。
            > 5. 拟声词译成对应的中文拟声词，语气词按中文口语习惯表达。
            > 6. 人名、地名用通行的中文译名或保留汉字，不要写成片假名。

            并且带了一组「おはよう → 早上好」的示例，让模型照着格式输出。

            免费接口那一侧也确认过：请求参数是 `tl=zh-CN`，目标就是简体中文。

            ### 新增译文语言校验

            提示词是"请求"，不是"保证"。模型有时会把日文原样返回，
            以前这种结果会被当成译文写进缓存、烧进图片，看起来就是"翻译出来不是中文"。

            现在每条译文都要过一道字符校验：假名数量达到 2 个、
            且占比超过 18%，就判定这条还是日文，直接丢弃、不写缓存、不烧录。
            中文里偶尔出现的「の」这类单字不会误伤。

            ### 旧缓存里的日文会自动重做

            之前版本存进缓存、甚至已经烧到图上的日文，会被识别为脏数据。
            点一次「翻译整本」，这些页会重新 OCR、重新翻译、重新烧录，不用手动清缓存。

            ### 「测试连接」能直接看出模型行不行

            现在点测试连接，如果模型连通但返回的仍是日文，
            会直接提示「模型返回的仍是日文，没有执行翻译」，并建议换对话模型。
            不用再靠眼睛看整页效果判断。

            ### 关于视觉模型

            全程不需要视觉模型。日文识别是手机本地用 ML Kit 做的，
            发给 API 的只有识别出来的纯文本，纯文本对话模型就够：
            `deepseek-chat`、`gpt-4o-mini`、`qwen-plus`、`glm-4-flash` 都可以。

            ---

            ## v1.3.8：修复设置闪退

            ### 修复：设置 → 翻译 一点就退出

            翻译引擎这一项在布局里用的是项目自带的列表控件，
            代码里却按系统库的同名控件去取，进入页面时类型转换失败，进程直接退出。
            已改为取正确的控件类型。

            拉取模型、填写地址、填写 Key 的回填逻辑也一并核对过，选中模型会立即写入并刷新摘要。

            ---

            ## v1.3.7：默认走大模型 API，设置里能直接拉模型列表

            ### 默认引擎改成大模型 API

            装好就是「大模型 API」引擎，填了 Key 立刻生效，不用再去切一次。
            没填 Key 时自动回落到内置免费接口，不会出现一句都翻不出来的情况。

            ### 新增「从上游获取模型」

            设置 → 翻译 → 从上游获取模型，直接读服务商的 `/models` 接口，
            弹窗列出所有可用模型，点一下自动填好模型名，不用再去官网抄模型 ID。

            - 兼容 OpenAI 的 `/chat/completions`：DeepSeek、OpenAI、通义千问、Kimi、智谱、硅基流动、本地 Ollama
            - 地址写 `https://api.deepseek.com` 或 `https://api.openai.com/v1` 都能识别，拉列表时自动补 `/v1`
            - 服务商没实现 `/models` 时会提示原因，仍可手填模型名
            - Key 只存在本机设置里，不上传任何地方
            - 内置免费接口仍然保留，设置里随时可以切回去

            注意：已经翻译过的页不会因为换引擎而重翻，
            想用新引擎重翻某本书，先在阅读器菜单里「清除本书翻译缓存」。

            ---

            ## v1.3.6：让翻译快起来

            ### 1. 整本翻译改成两页并行

            原来是取图 → OCR → 翻译 → 烧录，一页一页串行，每一步都在等上一步。
            翻译是跨境网络请求，单页要 1~3 秒，一本一百页就是好几分钟。
            现在页面之间并行，取图/OCR/烧录的本地时间和网络等待重叠执行。
            堆小于 192MB 的机型自动退回单线程，避免 OOM。

            ### 2. 逐块翻译改成 3 路并发

            整页批量请求失败会退回逐块翻译。原来一块一次请求、块之间还 sleep 120ms，
            一页二十来个气泡要等半分钟以上。现在 3 路并发，相同原文只翻一次
            （"嗯""啊"这类重复在漫画里很多）。

            ### 3. 断网时不再死等

            连续 4 个块失败就判定网络不通，本页剩余块直接跳过；一句都没译出来时
            不再补两轮（那只是把同样的超时再跑一遍）。以前网络差的时候一页能卡几分钟。

            ## 安装

            签名和包名与 v1.3.5 相同，直接覆盖安装即可。

            ---

            ## 上一版（v1.3.5）修复的问题

            ### 1. 单页翻译失败不再写缓存

            原来单页翻译只要 OCR 出了文字就写缓存，哪怕一句都没译出来（限流、断网）。
            写进去之后这一页就被判定"已翻译"，整本翻译从此永久跳过它。
            现在一句话都没译出来时不写缓存，并提示失败。

            ### 2. OCR 超时会崩溃

            识别超时（首次加载模型、超长页）时，`CountDownLatch` 返回了，但 ML Kit
            内部任务还在读那张 bitmap。调用方紧接着 `recycle()`，轻则抛
            "trying to use a recycled bitmap"，重则 native 崩溃。
            现在 OCR 会回报"是否可安全回收"，超时就不回收，交给 GC。

            ### 3. 单页翻译会把旧缓存"冒充"成新版

            v1 缓存要在整本翻译时重建，但单页翻译写盘时把版本号直接写成了当前版本，
            整本翻译的旧版判定随之失效，其余页的漏字就被永久固化。
            现在写盘保留原版本号，只有整本重建或新画廊才写当前版本。

            ### 4. 补烧录时顺带补译漏句

            以前"已有缓存但没烧录图"的页只重新生成图片，缓存里那些当年没译出来的空句
            就一直是空的。现在会先把缺的句子补译一遍再烧录。

            ### 5. 白色背景不再糊住画面

            `StaticLayout.getWidth()` 返回的是构造时的最大宽度，不是文字实际宽度，
            结果每块译文都画成一条和最大宽度一样宽的白色长条。
            现在按文字真实宽度绘制，只盖住原来那句日文。

            ### 6. 译文写入改为原子替换

            原来是"删旧文件 → 重命名"，两步之间被杀进程会连旧译文一起丢。
            现在直接 rename（Linux 上原子替换），掉电也不会把整本翻译成果清零。

            ### 7. 阅读模式不再无限重试

            下载任务仍然"失败必须重到成功"；但阅读模式下用户已经翻过去了，
            无限重下只会耗电、持续请求站点，还会让下载线程永不退出。
            阅读模式改为最多补 3 次。

            ### 8. 低内存机型不再因烧录崩溃

            2600px 页面做 ARGB_8888 副本约 37MB，内存不足时降级到 RGB_565。

            ## 使用提示

            装好后对翻译过的书点一次「翻译整本」，会把漏译的句子补上；
            之前画成白色长条的页会被重新烧录。

            ## 之前版本已修复

            - OCR 分辨率 2600 + 长页切片识别，小字不再漏
            - 译文不再被 clipRect 裁掉
            - v1 残缺缓存会整本重建
            - 下载失败页无限退避重试，不再作废
            - 烧录图迁到 filesDir，烧录缺失时回退气泡
            - 解除 OkHttp 单 host 5 并发上限、去掉图片重复磁盘缓存
          files: EhViewer_v1.3.10_tls.apk
          draft: false
          prerelease: false
